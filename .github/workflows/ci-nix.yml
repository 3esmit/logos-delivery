name: ci / nix
permissions:
  contents: read
  pull-requests: read
  checks: write
on:
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        system:
          - x86_64-linux
        nixpkg:
          - liblogosdelivery

        include:
          - system: x86_64-linux
            runs_on: ubuntu-22.04

    name: '${{ matrix.system }} / ${{ matrix.nixpkg }}'
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
        with:
          diagnostic-endpoint: ""
          github-token: ""
      - uses: logos-co/setup-nix-cache-action@v1
        with:
          install-nix: false
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      - name: 'Run Nix build for ${{ matrix.nixpkg }}'
        shell: bash
        run: nix build -L '.#${{ matrix.nixpkg }}'

      - name: 'Show result contents'
        shell: bash
        run: find result -type f
